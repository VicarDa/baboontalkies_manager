<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签到管理 - 约课数据管理</title>
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body { padding: 0; }
        .page-wrapper { display: flex; min-height: 100vh; }
        .sidebar {
            width: 220px; background: #fff; border-right: 1px solid #e8eaed;
            padding: 0; position: fixed; height: 100vh; overflow-y: auto;
        }
        .sidebar-header {
            padding: 20px; border-bottom: 1px solid #e8eaed;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .sidebar-header h1 { color: white; font-size: 1.2rem; margin: 0; }
        .sidebar-header .refresh-info { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 8px; }
        .main-content {
            margin-left: 220px; flex: 1; padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%); min-height: 100vh;
        }
        .content-container {
            background: #ffffff; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); overflow: hidden; padding: 20px;
        }
        .sidebar-nav { list-style: none; padding: 10px 0; margin: 0; }
        .sidebar-nav li { margin: 2px 8px; }
        .sidebar-nav a {
            display: flex; align-items: center; padding: 12px 16px; color: #555;
            text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s ease;
        }
        .sidebar-nav a:hover { background: #f0f2f5; color: #333; }
        .sidebar-nav a.active {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: #ffffff; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        .sidebar-nav .nav-icon { margin-right: 10px; font-size: 1.1em; width: 24px; text-align: center; }
        .sidebar-divider { height: 1px; background: #e8eaed; margin: 10px 16px; }
        .sidebar-refresh { padding: 12px 15px; border-bottom: 1px solid #e8eaed; }
        .sidebar-refresh button {
            width: 100%; padding: 10px;
            background: #fff; color: #10b981;
            border: 2px solid #10b981; border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 600;
            transition: all 0.2s ease;
        }
        .sidebar-refresh button:hover {
            background: #f0fdf4; border-color: #059669; color: #059669;
        }
        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-header h1, .sidebar-nav span:not(.nav-icon), .sidebar-refresh { display: none; }
            .main-content { margin-left: 60px; }
            .sidebar-nav a { justify-content: center; padding: 12px; }
            .sidebar-nav .nav-icon { margin-right: 0; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <nav class="sidebar">
            <div class="sidebar-header">
                <h1>约课数据管理</h1>
                <div class="refresh-info">
                    <div>最后更新: <span id="lastRefreshTime">加载中...</span></div>
                    <div id="dataDateRange" style="font-size: 11px; margin-top: 4px;"></div>
                </div>
            </div>
            <div class="sidebar-refresh">
                <button id="refreshButton">刷新数据</button>
            </div>
            <ul class="sidebar-nav">
                <li><a href="/students"><span class="nav-icon">📚</span><span>学员数据</span></a></li>
                <li><a href="/teachers"><span class="nav-icon">👨‍🏫</span><span>老师数据</span></a></li>
                <li><a href="/salary"><span class="nav-icon">💰</span><span>工资计算</span></a></li>
                <li><a href="/materials"><span class="nav-icon">🗂️</span><span>教材管理</span></a></li>
                <div class="sidebar-divider"></div>
                <li><a href="/feifei/teachers" class="active"><span class="nav-icon">🧑‍🏫</span><span>签到管理</span></a></li>
                <li><a href="/feifei/sessions"><span class="nav-icon">📅</span><span>课节管理</span></a></li>
                <li><a href="/feifei/labels"><span class="nav-icon">🏷️</span><span>标签管理</span></a></li>
                <div class="sidebar-divider"></div>
                <li><a href="/settings"><span class="nav-icon">⚙️</span><span>系统设置</span></a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="content-container">
                <h3 style="margin-bottom: 20px; color: #333;">🧑‍🏫 签到管理</h3>

                <!-- 搜索筛选区 -->
                <div style="display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
                    <input type="text" id="feifeiTeacherKeyword" placeholder="搜索教师姓名..."
                           style="padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; width: 200px;">
                    <label style="display: flex; align-items: center; gap: 5px;">
                        <input type="checkbox" id="feifeiTeacherHasClass" checked>
                        <span>仅显示未来30天有课</span>
                    </label>
                    <button onclick="loadFeifeiTeachers()" style="padding: 8px 16px; background: #4285f4; color: white; border: none; border-radius: 6px; cursor: pointer;">搜索</button>
                </div>

                <!-- 教师列表表格 -->
                <div style="background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;">
                    <table style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr style="background: #f5f5f5;">
                                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0;">教师姓名</th>
                                <th style="padding: 12px; text-align: center; border-bottom: 1px solid #e0e0e0;">类型</th>
                                <th style="padding: 12px; text-align: center; border-bottom: 1px solid #e0e0e0;">近30天课时</th>
                                <th style="padding: 12px; text-align: center; border-bottom: 1px solid #e0e0e0;">未来30天课时</th>
                                <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0;">签到URL</th>
                                <th style="padding: 12px; text-align: center; border-bottom: 1px solid #e0e0e0;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="feifeiTeacherTableBody">
                            <tr><td colspan="6" style="text-align: center; padding: 40px; color: #999;">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- 点击教师行后展示签到明细 -->
                <div id="teacherSigninDetailsPanel" style="margin-top: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; display: none;">
                    <div style="padding: 14px 16px; border-bottom: 1px solid #eee; background: #fafafa; display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                        <div>
                            <div id="teacherSigninDetailsTitle" style="font-size: 16px; font-weight: 600; color: #333;">签到明细</div>
                            <div style="font-size: 12px; color: #888; margin-top: 4px;">展示该老师点击进入签到详情页后记录的数据</div>
                        </div>
                        <button onclick="closeTeacherSigninDetails()" style="padding: 6px 12px; border: 1px solid #ddd; background: #fff; border-radius: 6px; cursor: pointer;">关闭</button>
                    </div>
                    <div style="overflow-x: auto;">
                        <table style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr style="background: #f5f5f5;">
                                    <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0;">学生</th>
                                    <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0;">课节</th>
                                    <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0;">课节时间</th>
                                    <th style="padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0;">进入时间</th>
                                </tr>
                            </thead>
                            <tbody id="teacherSigninDetailsBody">
                                <tr><td colspan="4" style="text-align: center; padding: 24px; color: #999;">请选择老师查看</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 签到配置弹窗 -->
    <div id="feifeiSigninConfigModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
        <div style="background: white; padding: 30px; border-radius: 12px; width: 400px; max-width: 90%;">
            <h3 style="margin-bottom: 20px;">签到配置 - <span id="signinConfigTeacherName"></span></h3>
            <input type="hidden" id="signinConfigTeacherUid">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">签到开始时间（课前分钟数）</label>
                <input type="number" id="signinStartTime" min="0" value="120" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">签到结束时间（课前分钟数）</label>
                <input type="number" id="signinEndTime" min="0" value="0" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="closeSigninConfigModal()" style="padding: 10px 20px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; cursor: pointer;">取消</button>
                <button onclick="saveSigninConfig()" style="padding: 10px 20px; background: #4285f4; color: white; border: none; border-radius: 6px; cursor: pointer;">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js"></script>
    <script src="/js/feifei-teachers.js"></script>
</body>
</html>
