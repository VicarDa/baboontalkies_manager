<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/signin-h5/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Sign-in</title>
    <link rel="stylesheet" crossorigin href="/signin-h5/assets/index-BkWFE3Xw.css?v=20260211-2">
    <link rel="stylesheet" href="/signin-h5/index.css?v=20260211-9" />
    <script>
      (function () {
        var query = new URL(window.location.href).searchParams;
        var queryApiBase = query.get('apiBase') || '';
        var storedApiBase = '';
        try {
          storedApiBase = window.localStorage ? window.localStorage.getItem('signinApiBase') || '' : '';
        } catch (e) {}

        var host = window.location.hostname;
        var port = window.location.port;
        var isLocalHost = ['localhost', '127.0.0.1'].includes(host);
        var isFileProtocol = window.location.protocol === 'file:';
        var isManagerLocalHost = isLocalHost && port === '3000';
        var isLocalDevHost = isLocalHost && port && port !== '3000';
        var defaultApiBase = (isFileProtocol || isLocalDevHost) ? 'http://127.0.0.1:3000' : '';

        // 在本地 manager(3000) 环境，默认不使用历史缓存的 apiBase，避免被旧域名污染导致接口卡住
        if (isManagerLocalHost && !queryApiBase) {
          storedApiBase = '';
          try {
            if (window.localStorage) window.localStorage.removeItem('signinApiBase');
          } catch (e) {}
        }

        var apiBase = (queryApiBase || storedApiBase || defaultApiBase || '').replace(/\/$/, '');
        if (apiBase) {
          window.__SIGNIN_API_BASE__ = apiBase;

          try {
            if (queryApiBase && window.localStorage) {
              window.localStorage.setItem('signinApiBase', apiBase);
            }
          } catch (e) {}

          var rewriteApiUrl = function (url) {
            if (typeof url !== 'string') return url;
            if (/^https?:\/\//i.test(url)) return url;
            if (url.indexOf('/wechat') === 0) return apiBase + url;
            return url;
          };

          var originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url) {
            var rewrittenUrl = rewriteApiUrl(url);
            var args = [method, rewrittenUrl];
            for (var i = 2; i < arguments.length; i += 1) args.push(arguments[i]);
            return originalOpen.apply(this, args);
          };

          if (window.fetch) {
            var originalFetch = window.fetch.bind(window);
            window.fetch = function (input, init) {
              if (typeof input === 'string') {
                return originalFetch(rewriteApiUrl(input), init);
              }
              return originalFetch(input, init);
            };
          }
        }

        var baseTitle = 'Check in System';
        var syncVisibleTitle = function () {
          var visibleTitleEl = document.getElementById('signin-visible-title');
          if (!visibleTitleEl) return;
          visibleTitleEl.textContent = (document.title || baseTitle).trim();
        };
        var formatTitle = function () {
          var current = (document.title || '').trim();
          if (!current || current === 'Teacher Sign-in' || current === baseTitle) {
            document.title = baseTitle;
            syncVisibleTitle();
            return;
          }
          if (current.indexOf(baseTitle + '：') === 0) return;
          document.title = baseTitle + '：' + current;
          syncVisibleTitle();
        };

        formatTitle();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', formatTitle);
        } else {
          syncVisibleTitle();
        }
        var titleEl = document.querySelector('title');
        if (titleEl && window.MutationObserver) {
          new MutationObserver(formatTitle).observe(titleEl, {
            childList: true,
            subtree: true,
            characterData: true,
          });
        }
        var retryCount = 0;
        var retryTimer = window.setInterval(function () {
          retryCount += 1;
          formatTitle();
          if (retryCount >= 20 || document.title.indexOf(baseTitle + '：') === 0) {
            window.clearInterval(retryTimer);
          }
        }, 500);
      })();
    </script>
    <script type="module" crossorigin src="/signin-h5/assets/index-tRyHEpkz.js?v=20260211-11"></script>
  </head>
  <body>
    <div id="signin-visible-title" aria-live="polite"></div>
    <div id="app"></div>
  </body>
</html>
