edition: 3.0.0
name: baboontalkies-app
access: "developer_flycatbbb"

vars:
  region: cn-hangzhou

resources:
  baboontalkies_manager:
    component: fc3
    props:
      region: ${vars.region}
      functionName: baboontalkies_manager-mcp
      description: "约课宝数据抓取和管理系统 - Dashboard服务（Docker容器）"
      runtime: custom-container
      customContainerConfig:
        image: registry.cn-hangzhou.aliyuncs.com/fc-baboontalkies/baboontalkies:latest
        command:
          - "node"
        args:
          - "index.mjs"
        webServerMode: true
      cpu: 2.0
      memorySize: 4096
      timeout: 900
      diskSize: 10240
      instanceConcurrency: 1

      # 环境变量配置
      environmentVariables:
        NODE_ENV: production
        PORT: "9000"
        HTTPS: "false"
        BASE_PATH: "/baboontalkies_manager"

      # 日志配置
      logConfig:
        enableInstanceMetrics: true
        enableRequestMetrics: true
        logBeginRule: DefaultRegex
        logstore: default-logs
        project: serverless-cn-hangzhou-ac3ea976-494e-52ba-83d4-ba85d6f01d38

      # 触发器配置
      triggers:
        # HTTP 触发器 - 用于 Dashboard Web 访问和手动刷新
        - triggerName: httpTrigger
          triggerType: http
          description: "HTTP触发器 - Dashboard访问"
          qualifier: LATEST
          triggerConfig:
            authType: anonymous
            disableURLInternet: false
            methods:
              - GET
              - POST
              - PUT
              - DELETE
